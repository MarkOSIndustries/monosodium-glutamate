plugins {
  id 'org.jetbrains.kotlin.jvm'
  id 'java-library'
}

repositories {
  mavenCentral()
}

dependencies {
  implementation group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib'
  testImplementation group: 'junit', name: 'junit', version: '4.11'
  testImplementation group: 'org.jetbrains.kotlin', name: 'kotlin-test-junit'

  implementation group: 'org.slf4j', name: 'slf4j-nop', version: '1.7.25'
  api project(':msg-schemas')
  api group: 'com.squareup.wire', name: 'wire-compiler', version: '6.2.0'
  api group: 'com.google.protobuf', name: 'protobuf-java-util', version: protobufVersion
  api group: 'com.alibaba.fastjson2', name: 'fastjson2', version: '2.0.51'
}
